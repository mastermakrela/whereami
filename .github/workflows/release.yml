name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The actual publish step below always runs the real `npm` CLI, not bun/pnpm —
      # npm's OIDC trusted publishing (no NPM_TOKEN needed) only works there, and
      # only on npm >= 11.5.1. Node 22's bundled npm is older than that, which
      # surfaces as a confusing 404 on publish (npm couldn't send/match the OIDC
      # token, not an actual "package not found"), so upgrade it explicitly.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest

      - run: bun install --frozen-lockfile
      - run: bun run test

      - name: Check for pending changesets
        id: changesets
        run: |
          PENDING=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md')
          if [ -n "$PENDING" ]; then
            echo "has-changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-changesets=false" >> "$GITHUB_OUTPUT"
          fi

      # Bumps package.json + CHANGELOG.md and commits straight to main — no PR, no
      # review checkpoint. This intentionally skips changesets/action's usual
      # "Version Packages" PR flow: that needs the repo's "Allow GitHub Actions to
      # create and approve pull requests" setting enabled, and a push-then-publish
      # flow is simpler for a single-package repo anyway. Pushing with the default
      # GITHUB_TOKEN doesn't trigger another workflow run, so this can't loop.
      - name: Version
        if: steps.changesets.outputs.has-changesets == 'true'
        run: |
          bunx changeset version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Version Packages"
          git push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if this version is already published
        id: version-check
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current version: $CURRENT_VERSION"

          LATEST_VERSION=$(npm view vite-plugin-whereami version 2>/dev/null || echo "0.0.0")
          echo "Latest published: $LATEST_VERSION"

          IS_NEWER=$(node -e "
            const current = '$CURRENT_VERSION';
            const latest = '$LATEST_VERSION';

            function compareVersions(a, b) {
              const aParts = a.split('.').map(Number);
              const bParts = b.split('.').map(Number);
              for (let i = 0; i < Math.max(aParts.length, bParts.length); i++) {
                const aPart = aParts[i] || 0;
                const bPart = bParts[i] || 0;
                if (aPart > bPart) return 1;
                if (aPart < bPart) return -1;
              }
              return 0;
            }

            console.log(compareVersions(current, latest) > 0 ? 'true' : 'false');
          ")
          echo "Is newer: $IS_NEWER"
          echo "is-newer=$IS_NEWER" >> "$GITHUB_OUTPUT"

      - name: Build
        if: steps.version-check.outputs.is-newer == 'true'
        run: bun run build

      - name: Publish to npm
        if: steps.version-check.outputs.is-newer == 'true'
        run: npm publish
